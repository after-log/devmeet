apiVersion: apps/v1
kind: Deployment
metadata:
  name: devmeet
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devmeet
  template:
    metadata:
      labels:
        app: devmeet
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: devmeet
          image: docker.io/library/devmeet:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: devmeet
  namespace: default
spec:
  selector:
    app: devmeet
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devmeet
  namespace: default
spec:
  ingressClassName: traefik
  rules:
    - host: devmeet.zmint.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: devmeet
                port:
                  number: 80
  tls:
    - hosts:
        - devmeet.zmint.dev
      secretName: zmint-dev-tls
