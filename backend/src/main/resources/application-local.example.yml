# Copy to application-local.yml and enter your remote MySQL connection details.
spring:
  datasource:
    url: jdbc:mysql://YOUR_DB_HOST:3306/YOUR_DB_NAME?connectionTimeZone=UTC
    username: YOUR_DB_USERNAME
    password: YOUR_DB_PASSWORD
app:
  public-url: http://localhost:5173
  photo-directory: ./data/photos
  require-github: false
  oauth:
    github:
      client-id: ""
      client-secret: ""
    kakao:
      client-id: ""
      client-secret: ""

# Run ./gradlew setupLocalAdmin once to create .local/admin.properties (ignored by Git).
# Production: set ADMIN_USERNAME and ADMIN_PASSWORD_HASH (BCrypt; never use a frontend secret).
