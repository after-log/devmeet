# Copy to application-local.yml and enter your remote MySQL connection details.
spring:
  datasource:
    url: jdbc:mysql://YOUR_DB_HOST:3306/YOUR_DB_NAME?connectionTimeZone=UTC
    username: YOUR_DB_USERNAME
    password: YOUR_DB_PASSWORD
app:
  public-url: http://localhost:5173
  admin-emails: "" # Comma-separated email addresses of explicitly designated administrators.
  photo-directory: ./data/photos
  require-github: false
  oauth:
    github:
      client-id: ""
      client-secret: ""
    kakao:
      client-id: ""
      client-secret: ""
